name: Trigger backend scheduled job

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      ai_enabled:
        description: "Force AI classification for this run only"
        required: false
        default: "false"
      ai_max_items:
        description: "AI max announcements for this run (optional)"
        required: false
        default: ""

jobs:
  run-cron-job:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend /api/jobs/daily
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AI_ENABLED_INPUT: ${{ github.event.inputs.ai_enabled || 'false' }}
          AI_MAX_ITEMS_INPUT: ${{ github.event.inputs.ai_max_items || '' }}
        run: |
          set -euo pipefail

          if [ -z "${API_BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Missing required secrets: API_BASE_URL or CRON_SECRET"
            exit 1
          fi

          AI_ENABLED="${AI_ENABLED_INPUT:-false}"
          AI_MAX_ITEMS="${AI_MAX_ITEMS_INPUT:-}"
          if [ "${AI_ENABLED}" != "true" ] && [ "${AI_ENABLED}" != "false" ]; then
            AI_ENABLED="false"
          fi

          if [ -n "${AI_MAX_ITEMS}" ]; then
            PAYLOAD="$(jq -n --arg trigger "github-actions-cron" --argjson aiMax "${AI_MAX_ITEMS}" --arg aiEnabled "${AI_ENABLED}" '{trigger:$trigger, ai:{enabled:($aiEnabled=="true"), maxItems:$aiMax}}')"
          else
            PAYLOAD="$(jq -n --arg trigger "github-actions-cron" --arg aiEnabled "${AI_ENABLED}" '{trigger:$trigger, ai:{enabled:($aiEnabled=="true")}}')"
          fi

          echo "Triggering backend job at ${API_BASE_URL}/api/jobs/daily"
          echo "AI override enabled: ${AI_ENABLED}; AI max items override: ${AI_MAX_ITEMS:-<none>}"

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(
            curl --show-error --silent \
              -o "${RESPONSE_FILE}" \
              -w "%{http_code}" \
              -X POST "${API_BASE_URL}/api/jobs/daily" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -d "${PAYLOAD}"
          )"

          echo "Backend response code: ${HTTP_CODE}"
          if jq -e . "${RESPONSE_FILE}" >/dev/null 2>&1; then
            jq '{
              ok,
              runCount,
              lastCronRunAt,
              nseSync: (.nseSync | {newCount, fetchedCount, totalStored, syncedAt}),
              bseSync: (.bseSync | {newCount, fetchedCount, totalStored, syncedAt}),
              dedupSync: (.dedupSync | {dedupedCount, touchedCount, totalStored, syncedAt, skipped, reason}),
              aiClassification: (.aiClassification | {
                skipped,
                reason,
                criteriaVersion,
                forceEnabled,
                maxItems,
                candidateCount,
                queuedCount,
                processedCount,
                successCount,
                failureCount,
                failedSamples
              })
            }' "${RESPONSE_FILE}"
          else
            echo "Backend response (non-JSON):"
            cat "${RESPONSE_FILE}"
          fi

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Cron trigger failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Cron trigger completed"
